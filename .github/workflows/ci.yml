name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Syntax check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: node --check
        run: npm run check
      - name: node --test
        run: npm test

  build:
    name: Build app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GOCO.app
        run: scripts/build-app.sh
      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 build/GOCO.app
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: GOCO-app
          path: dist/*.zip
          retention-days: 7
